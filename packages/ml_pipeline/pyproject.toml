[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corp-ml-pipeline"
version = "0.1.0"
description = "증빙 OCR+정보추출 / 계정과목 자동분류 / 이상거래 탐지 / 현금흐름·매출 예측"
requires-python = ">=3.10"
dependencies = [
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "statsmodels>=0.14",
  "joblib>=1.3",
]

[project.optional-dependencies]
ocr = ["easyocr>=1.7"]

[tool.setuptools.packages.find]
include = ["ml_pipeline*"]

[tool.setuptools.package-data]
ml_pipeline = ["data/*.json", "models/*.joblib"]
