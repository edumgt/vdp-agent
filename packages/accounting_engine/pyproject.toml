[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corp-accounting-engine"
version = "0.1.0"
description = "총계정원장/재무제표/세금계산서 정리표/결산보고서 렌더트리 빌더 + 재무비율 분석"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["accounting_engine*"]
