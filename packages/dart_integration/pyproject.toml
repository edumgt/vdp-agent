[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corp-dart-integration"
version = "0.1.0"
description = "OpenDART(전자공시시스템) 회사검색/재무제표 수집 + 내부 템플릿으로 재현"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "corp-accounting-engine"]

[tool.setuptools.packages.find]
include = ["dart_integration*"]

[tool.setuptools.package-data]
dart_integration = ["fixtures/*"]
